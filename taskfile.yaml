version: '3'

tasks:
  cleantf:
    desc: Removes the .terraform folder
    cmds:
      - rm -rf .terraform
    ignore_error: true

  clear_env:
    cmds:
      - rm .env
    ignore_error: true

  initenv-*:
    desc: Runs terraform init for an environment (lab03 or live)
    vars:
      WORKSPACE: '{{index .MATCH 0}}'
    cmds:
      - task: init
        vars:
          WORKSPACE: '{{ .WORKSPACE }}'
          BUCKET_ENV: '{{if eq .WORKSPACE "lab03"}}labs{{else}}{{ .WORKSPACE }}{{end}}'

  init:
    dotenv: ['.env']
    requires:
      vars:
        - name: WORKSPACE
          enum: [lab03, live]
        - name: BUCKET_ENV
          enum: [labs, live]
    cmds:
      - task: cleantf
      - terraform init -backend-config="bucket=mdtp-terraform-public-artefact-store-{{ .BUCKET_ENV }}"
      - terraform workspace select {{ .WORKSPACE }}

  plantf-*:
    desc: Runs a terraform plan (lab03 or live)
    dotenv: ['.env']
    vars:
      PLANENV: '{{index .MATCH 0}}'
    cmds:
      - task: clear_env
      - task: initenv-{{ .PLANENV }}
      - terraform plan -out={{ .PLANENV }}-terraform.plan -lock-timeout=30s

  applytf-*:
    desc: Runs a terraform apply (lab03/live)
    dotenv: ['.env']
    vars:
      APPLYENV: '{{index .MATCH 0}}'
    cmds:
      - task: plantf-{{ .APPLYENV }}
      - terraform apply {{ .APPLYENV }}-terraform.plan
      - rm {{ .APPLYENV }}-terraform.plan
      - task: clear_env
